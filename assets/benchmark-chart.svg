<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="100%" height="100%">
  <!-- Background -->
  <rect width="1040" height="440" fill="#0F1117" stroke="#2D333B" stroke-width="1"/>

  <!-- Technical Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="0" y1="50" x2="1040" y2="50"/>
    <line x1="0" y1="150" x2="1040" y2="150"/>
    <line x1="0" y1="250" x2="1040" y2="250"/>
    <line x1="0" y1="350" x2="1040" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="440"/>
    <line x1="400" y1="0" x2="400" y2="440"/>
    <line x1="600" y1="0" x2="600" y2="440"/>
    <line x1="800" y1="0" x2="800" y2="440"/>
  </g>

  <!-- Header -->
  <g transform="translate(32, 36)">
    <rect x="0" y="0" width="12" height="12" fill="#F6821F"/>
    <text x="20" y="11" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">EMPIRICAL BENCHMARK // GNU DIFF3 VS. CONVERGENCE AST-CRDT</text>
    <text x="600" y="11" fill="#7D8590" font-family="monospace" font-size="11">HARNESS: 25 CONCURRENT AGENT REPOSITORIES</text>
  </g>

  <!-- Metric 1: Merge Conflict Rate -->
  <g transform="translate(32, 75)">
    <rect width="976" height="110" fill="#161B22" stroke="#2D333B" stroke-width="1" rx="2"/>
    <text x="16" y="24" fill="#E6EDF3" font-family="monospace" font-size="11" font-weight="700">1. MERGE CONFLICT RATE (LOWER IS BETTER)</text>

    <!-- Git Line -->
    <text x="16" y="52" fill="#7D8590" font-family="monospace" font-size="11">Traditional Git (GNU diff3):</text>
    <rect x="220" y="40" width="650" height="18" fill="#EF4444" rx="2"/>
    <text x="880" y="54" fill="#EF4444" font-family="monospace" font-size="11" font-weight="700">96.0% (24 / 25)</text>

    <!-- Convergence Line -->
    <text x="16" y="86" fill="#7D8590" font-family="monospace" font-size="11">Convergence (AST-CRDT):</text>
    <rect x="220" y="74" width="8" height="18" fill="#10B981" rx="2"/>
    <text x="240" y="88" fill="#10B981" font-family="monospace" font-size="11" font-weight="700">0.0% (0 Conflicts — 100% Resolved)</text>
  </g>

  <!-- Metric 2: Concurrency Success Rate -->
  <g transform="translate(32, 200)">
    <rect width="976" height="110" fill="#161B22" stroke="#2D333B" stroke-width="1" rx="2"/>
    <text x="16" y="24" fill="#E6EDF3" font-family="monospace" font-size="11" font-weight="700">2. CONCURRENT MERGE SUCCESS RATE (HIGHER IS BETTER)</text>

    <!-- Git Line -->
    <text x="16" y="52" fill="#7D8590" font-family="monospace" font-size="11">Traditional Git (GNU diff3):</text>
    <rect x="220" y="40" width="28" height="18" fill="#EF4444" rx="2"/>
    <text x="258" y="54" fill="#EF4444" font-family="monospace" font-size="11" font-weight="700">4.0% (1 Fast-Forward Only)</text>

    <!-- Convergence Line -->
    <text x="16" y="86" fill="#7D8590" font-family="monospace" font-size="11">Convergence (AST-CRDT):</text>
    <rect x="220" y="74" width="700" height="18" fill="#10B981" rx="2"/>
    <text x="930" y="88" fill="#10B981" font-family="monospace" font-size="11" font-weight="700">100.0%</text>
  </g>

  <!-- Scale Verification Strip -->
  <g transform="translate(32, 325)">
    <rect width="976" height="85" fill="#161B22" stroke="#2D333B" stroke-width="1" rx="2"/>
    <div xmlns="http://www.w3.org/1999/xhtml">
      <div style="padding: 12px 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; color: #7D8590; line-height: 1.6;">
        <span style="color: #10B981; font-weight: bold;">● 100K AGENT SCALE VERIFICATION:</span>
        <span style="color: #E6EDF3;"> Evaluated 5,000 to 100,000 concurrent autonomous agents across 50 microservices.</span><br/>
        <span>Throughput: </span><span style="color: #E6EDF3; font-weight: bold;">60 commits/sec</span>
        <span> | Avg Latency: </span><span style="color: #E6EDF3; font-weight: bold;">10ms</span>
        <span> | Peak RAM: </span><span style="color: #E6EDF3; font-weight: bold;">130MB (Settled: 86MB)</span>
        <span> | AST Syntax Integrity: </span><span style="color: #10B981; font-weight: bold;">100% VALID (Zero Syntax Errors)</span>
      </div>
    </div>
  </g>
</svg>
