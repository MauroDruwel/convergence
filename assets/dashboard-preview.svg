      <rect width="400" height="48" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="14" y="20" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="700">BACKPRESSURE: interface:PaymentConfig</text>
      <text x="14" y="36" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Held by agent_architect | Downstream agents queued</text>
    </g>

    <!-- Reverse PR Mock -->
    <g transform="translate(20, 164)">
      <rect width="400" height="80" rx="6" fill="#182234" stroke="#a855f7" stroke-width="1"/>
      <text x="14" y="20" fill="#a855f7" font-family="monospace" font-size="11" font-weight="700">Reverse PR #42: Human Architectural Decision</text>
      <text x="14" y="38" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="10">Should payment backoff be exponential (2s,4s) or linear (3s)?</text>
      <rect x="14" y="48" width="160" height="22" rx="4" fill="#a855f7"/>
      <text x="94" y="63" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">✓ Exponential (Selected)</text>
    </g>
  </g>

  <!-- Bottom Section: Git Notes CoT & Real-Time Code Inspector -->
  <g transform="translate(30, 475)">
    <!-- Provenance Box -->
    <rect width="550" height="195" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="28" fill="#a855f7" font-family="monospace" font-size="12" font-weight="700">GIT NOTES CHAIN-OF-THOUGHT (refs/notes)</text>
    <g transform="translate(20, 42)">
      <rect width="510" height="135" rx="6" fill="#070b14"/>
      <text x="14" y="22" fill="#a855f7" font-family="monospace" font-size="10 font-weight=700">{ schema: "cloudflare.artifacts.provenance.v1" }</text>
      <text x="14" y="42" fill="#38bdf8" font-family="monospace" font-size="10">agent: "agent_sentinel" | model: "@cf/meta/llama-3.3-70b-instruct"</text>
      <text x="14" y="62" fill="#94a3b8" font-family="monospace" font-size="10">intent: "Refactored payment idempotency guard"</text>
      <text x="14" y="82" fill="#10b981" font-family="monospace" font-size="10">reasoning: ["Analyzed AST", "Synthesized boundary check", "Pass: 0 errors"]</text>
      <text x="14" y="102" fill="#94a3b8" font-family="monospace" font-size="10">telemetry: { promptTokens: 420, completionTokens: 110, latencyMs: 12 }</text>
    </g>

    <!-- Code Inspector Box -->
    <g transform="translate(570, 0)">
      <rect width="570" height="195" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <text x="20" y="28" fill="#06b6d4" font-family="monospace" font-size="12" font-weight="700">LIVE UNIFIED CODEBASE (index.ts)</text>
      <g transform="translate(20, 42)">
        <rect width="530" height="135" rx="6" fill="#070b14"/>
        <text x="14" y="22" fill="#94a3b8" font-family="monospace" font-size="10">// Reconciled via AST-CRDT (5,000+ Concurrent Symbols)</text>
        <text x="14" y="42" fill="#38bdf8" font-family="monospace" font-size="10">export function processOrder(orderId: string, amount: number): boolean {</text>
        <text x="14" y="62" fill="#10b981" font-family="monospace" font-size="10">  if (amount &lt;= 0) throw new RangeError("Invalid amount: " + amount);</text>
        <text x="14" y="82" fill="#e2e8f0" font-family="monospace" font-size="10">  return recordPayment(orderId, amount);</text>
        <text x="14" y="102" fill="#38bdf8" font-family="monospace" font-size="10">}</text>
      </g>
    </g>
  </g>
