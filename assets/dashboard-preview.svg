  <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5" fill="#10b981"/>
  <rect x="360" y="8" width="480" height="26" rx="6" fill="#1e293b"/>
  <text x="600" y="25" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">http://localhost:3000 — Convergence Swarm Control</text>

  <!-- Top App Navigation -->
  <g transform="translate(30, 60)">
    <rect width="32" height="32" rx="8" fill="url(#cfGrad)"/>
    <text x="16" y="22" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" text-anchor="middle">C</text>
    <text x="44" y="20" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">CONVERGENCE</text>
    <rect x="175" y="6" width="135" height="18" rx="4" fill="rgba(243,128,32,0.15)" stroke="rgba(243,128,32,0.3)" stroke-width="1"/>
