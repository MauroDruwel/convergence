    <!-- Status pill -->
    <rect x="940" y="4" width="180" height="26" rx="13" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <circle cx="956" cy="17" r="4" fill="#10b981"/>
    <text x="968" y="21" fill="#10b981" font-family="monospace" font-size="11" font-weight="600">Durable Object Active</text>
  </g>

  <!-- Metrics Row -->
  <g transform="translate(30, 110)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="215" height="65" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="14" y="22" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">CLEAN AST MERGES</text>
    <text x="14" y="48" fill="#10b981" font-family="monospace" font-size="20" font-weight="700">100%</text>

    <!-- Box 2 -->
    <rect x="230" y="0" width="215" height="65" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="244" y="22" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">GIT CONFLICTS</text>
    <text x="244" y="48" fill="#10b981" font-family="monospace" font-size="20" font-weight="700">0 (ELIMINATED)</text>

    <!-- Box 3 -->
    <rect x="460" y="0" width="215" height="65" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="474" y="22" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">SQLITE STORAGE</text>
    <text x="474" y="48" fill="#06b6d4" font-family="monospace" font-size="18" font-weight="700">ctx.storage.sql</text>

    <!-- Box 4 -->
    <rect x="690" y="0" width="215" height="65" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="704" y="22" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">LAMPORT CLOCK</text>
    <text x="704" y="48" fill="#f38020" font-family="monospace" font-size="20" font-weight="700">L: 12,480</text>

    <!-- Box 5 -->
    <rect x="920" y="0" width="220" height="65" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="934" y="22" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">THROUGHPUT</text>
    <text x="934" y="48" fill="#a855f7" font-family="monospace" font-size="18" font-weight="700">96+ commits/sec</text>
