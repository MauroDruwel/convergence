    <line x1="340" y1="140" x2="340" y2="225" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="340" cy="225" r="8" fill="#3b82f6"/>
    <text x="354" y="228" fill="#3b82f6" font-family="monospace" font-size="10">agent_auth</text>

    <line x1="340" y1="140" x2="255" y2="140" stroke="#a855f7" stroke-width="1.5"/>
