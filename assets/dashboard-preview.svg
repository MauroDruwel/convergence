  <!-- Middle Section: Swarm Topology Canvas Mockup -->
  <g transform="translate(30, 195)">
    <rect width="680" height="260" rx="10" fill="#070b14" stroke="#1e293b"/>
    <text x="20" y="28" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700">LIVE AGENT TOPOLOGY (ARTIFACTS RADIAL ORBIT)</text>

