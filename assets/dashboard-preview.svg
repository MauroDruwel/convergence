    <circle cx="340" cy="55" r="8" fill="#f38020"/>
    <text x="354" y="58" fill="#f38020" font-family="monospace" font-size="10">agent_sentinel</text>

    <line x1="340" y1="140" x2="425" y2="140" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="425" cy="140" r="8" fill="#10b981"/>
