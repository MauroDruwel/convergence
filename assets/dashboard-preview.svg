  <!-- Browser Window Chrome -->
  <rect width="1200" height="700" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  <rect width="1200" height="42" rx="14" fill="#0f172a"/>
  <!-- Window Controls -->
