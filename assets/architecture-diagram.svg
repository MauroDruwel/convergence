<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f38020"/>
      <stop offset="100%" stop-color="#faad3f"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="980" height="560" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Grid Pattern -->
  <g opacity="0.05">
    <path d="M 0 70 L 980 70 M 0 140 L 980 140 M 0 210 L 980 210 M 0 280 L 980 280 M 0 350 L 980 350 M 0 420 L 980 420 M 0 490 L 980 490" stroke="#ffffff" stroke-width="1"/>
    <path d="M 140 0 L 140 560 M 280 0 L 280 560 M 420 0 L 420 560 M 560 0 L 560 560 M 700 0 L 700 560 M 840 0 L 840 560" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Title Header -->
  <text x="40" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="0.5">CONVERGENCE // SYSTEM TOPOLOGY</text>
  <text x="40" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Cloudflare Challenge: Continuous Semantic Code Fabric for 100,000+ Concurrent Agents</text>

  <!-- LAYER 1: AGENT SWARM -->
  <g transform="translate(40, 110)">
    <rect width="250" height="390" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect width="250" height="36" rx="12" fill="#1e293b"/>
    <text x="16" y="23" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">AUTONOMOUS AGENT SWARM</text>

    <!-- Sub-agents -->
    <g transform="translate(16, 52)">
      <rect width="218" height="56" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.9"/>
      <circle cx="20" cy="28" r="6" fill="#3b82f6"/>
      <text x="36" y="24" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700">Agent Sentinel #01</text>
      <text x="36" y="42" fill="#94a3b8" font-family="monospace" font-size="9">Acquire Lease [func:auth]</text>
    </g>

    <g transform="translate(16, 120)">
      <rect width="218" height="56" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" opacity="0.9"/>
      <circle cx="20" cy="28" r="6" fill="#10b981"/>
      <text x="36" y="24" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700">Agent Payment #42</text>
      <text x="36" y="42" fill="#94a3b8" font-family="monospace" font-size="9">Commit [AST-CRDT Delta]</text>
    </g>

    <g transform="translate(16, 188)">
      <rect width="218" height="56" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" opacity="0.9"/>
      <circle cx="20" cy="28" r="6" fill="#f59e0b"/>
      <text x="36" y="24" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700">Agent Optimizer #88</text>
      <text x="36" y="42" fill="#94a3b8" font-family="monospace" font-size="9">Speculative Darwinian Branch</text>
    </g>

    <g transform="translate(16, 256)">
      <rect width="218" height="56" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1" opacity="0.9"/>
      <circle cx="20" cy="28" r="6" fill="#ec4899"/>
      <text x="36" y="24" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700">Agent Fuzzer #99</text>
      <text x="36" y="42" fill="#94a3b8" font-family="monospace" font-size="9">Adversarial Boundary Probe</text>
    </g>

    <g transform="translate(16, 324)">
      <rect width="218" height="50" rx="8" fill="#182234" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="109" y="30" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">+ 99,996 Concurrent Agents</text>
    </g>
  </g>

  <!-- LAYER 2: DURABLE OBJECT REPO BRAIN -->
  <g transform="translate(360, 110)">
    <rect width="290" height="390" rx="12" fill="#0f172a" stroke="#f38020" stroke-width="1.5" filter="url(#glow)" opacity="0.15"/>
    <rect width="290" height="390" rx="12" fill="#0f172a" stroke="#f38020" stroke-width="1.5"/>
    <rect width="290" height="36" rx="12" fill="#1e293b"/>
    <text x="16" y="23" fill="#f38020" font-family="monospace" font-size="12" font-weight="700">CLOUDFLARE DURABLE OBJECT (REPOBRAIN)</text>

    <!-- Sub components -->
    <g transform="translate(16, 52)">
      <rect width="258" height="68" rx="8" fill="#1e293b" stroke="#f38020" stroke-width="1"/>
      <text x="14" y="24" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700">Symbol Lease Engine</text>
      <text x="14" y="42" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Edit-Time AST locks with automatic</text>
      <text x="14" y="56" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10">real-time Semantic Backpressure</text>
    </g>

    <g transform="translate(16, 132)">
      <rect width="258" height="68" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="24" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700">Transactional SQLite (ctx.storage.sql)</text>
      <text x="14" y="42" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Atomic Symbol table, dependency graph,</text>
      <text x="14" y="56" fill="#10b981" font-family="-apple-system, sans-serif" font-size="10">operations log with ACID isolation</text>
    </g>

    <g transform="translate(16, 212)">
      <rect width="258" height="68" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
      <text x="14" y="24" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700">Git Notes Provenance Engine</text>
      <text x="14" y="42" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Stores Chain-of-Thought reasoning &</text>
      <text x="14" y="56" fill="#a855f7" font-family="-apple-system, sans-serif" font-size="10">token telemetry in refs/notes metadata</text>
    </g>

    <g transform="translate(16, 292)">
      <rect width="258" height="78" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
      <text x="14" y="24" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700">AST-CRDT Conflict-Free Reconciler</text>
      <text x="14" y="42" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Lamport-stamped symbol register merge.</text>
      <text x="14" y="56" fill="#06b6d4" font-family="-apple-system, sans-serif" font-size="10">Zero line conflicts across parallel edits</text>
      <text x="14" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Immune System auto-fuzzer & antibody guards</text>
    </g>
  </g>

  <!-- LAYER 3: STORAGE & RUNTIME (CLOUDFLARE ARTIFACTS & WORKERS AI) -->
  <g transform="translate(710, 110)">
    <!-- Artifacts Box -->
    <rect width="230" height="230" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="230" height="36" rx="12" fill="#1e293b"/>
    <text x="16" y="23" fill="#06b6d4" font-family="monospace" font-size="11" font-weight="700">CLOUDFLARE ARTIFACTS</text>

    <g transform="translate(14, 50)">
      <rect width="202" height="48" rx="6" fill="#1e293b"/>
      <text x="12" y="22" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">Git Wire Smart HTTP</text>
      <text x="12" y="38" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Zig Wasm Git Engine on DO</text>
    </g>

    <g transform="translate(14, 108)">
      <rect width="202" height="48" rx="6" fill="#1e293b"/>
      <text x="12" y="22" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">refs/notes/agent-provenance</text>
      <text x="12" y="38" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Auditable CoT metadata storage</text>
    </g>

    <g transform="translate(14, 166)">
      <rect width="202" height="48" rx="6" fill="#1e293b"/>
      <text x="12" y="22" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">Sparse Micro-Worktrees</text>
      <text x="12" y="38" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Ephemeral zero-copy task scopes</text>
    </g>

    <!-- Workers AI Box -->
    <g transform="translate(0, 250)">
      <rect width="230" height="140" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
      <rect width="230" height="36" rx="12" fill="#1e293b"/>
      <text x="16" y="23" fill="#a855f7" font-family="monospace" font-size="11" font-weight="700">WORKERS AI ARBITER</text>

      <g transform="translate(14, 48)">
        <text x="0" y="16" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">Llama 3.3 70B Instruct</text>
        <text x="0" y="34" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Edge inference for semantic invariant</text>
        <text x="0" y="48" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">clashes and automatic interface repair</text>
        <text x="0" y="66" fill="#10b981" font-family="monospace" font-size="9">● Zero Cold-Start Edge Execution</text>
      </g>
    </g>
  </g>

  <!-- Connective Arrows -->
  <g stroke="#f38020" stroke-width="2" fill="none" opacity="0.8">
    <!-- Agent to DO -->
    <path d="M 290 220 L 360 220" marker-end="url(#arrow)"/>
    <path d="M 290 310 L 360 310" marker-end="url(#arrow)"/>
    <!-- DO to Artifacts -->
    <path d="M 650 225 L 710 225" marker-end="url(#arrow)"/>
    <!-- DO to AI -->
    <path d="M 650 380 L 710 380" marker-end="url(#arrow)"/>
  </g>
</svg>
