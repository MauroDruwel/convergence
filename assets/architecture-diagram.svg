<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="100%" height="100%">
  <!-- Background -->
  <rect width="1040" height="580" fill="#0F1117" stroke="#2D333B" stroke-width="1"/>

  <!-- Technical Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="0" y1="60" x2="1040" y2="60"/>
    <line x1="0" y1="120" x2="1040" y2="120"/>
    <line x1="0" y1="180" x2="1040" y2="180"/>
    <line x1="0" y1="240" x2="1040" y2="240"/>
    <line x1="0" y1="300" x2="1040" y2="300"/>
    <line x1="0" y1="360" x2="1040" y2="360"/>
    <line x1="0" y1="420" x2="1040" y2="420"/>
    <line x1="0" y1="480" x2="1040" y2="480"/>
    <line x1="0" y1="540" x2="1040" y2="540"/>
    <line x1="130" y1="0" x2="130" y2="580"/>
    <line x1="260" y1="0" x2="260" y2="580"/>
    <line x1="390" y1="0" x2="390" y2="580"/>
    <line x1="520" y1="0" x2="520" y2="580"/>
    <line x1="650" y1="0" x2="650" y2="580"/>
    <line x1="780" y1="0" x2="780" y2="580"/>
    <line x1="910" y1="0" x2="910" y2="580"/>
  </g>

  <!-- Title & Specification -->
  <g transform="translate(32, 38)">
    <rect x="0" y="0" width="12" height="12" fill="#F6821F"/>
    <text x="20" y="11" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">CONVERGENCE // INFRASTRUCTURE TOPOLOGY</text>
    <text x="460" y="11" fill="#7D8590" font-family="monospace" font-size="11">ENGINEERING SPECIFICATION v2.0 • AUTHOR: MAURO DRUWEL</text>
  </g>

  <!-- SECTION 1: AGENT INGESTION -->
  <g transform="translate(32, 70)">
    <rect width="260" height="470" fill="#161B22" stroke="#2D333B" stroke-width="1" rx="2"/>
    <rect width="260" height="30" fill="#1C212A"/>
    <text x="12" y="20" fill="#7D8590" font-family="monospace" font-size="11" font-weight="700">01 / AUTONOMOUS SWARM CLIENTS</text>

    <!-- Node 1 -->
    <g transform="translate(12, 44)">
      <rect width="236" height="58" fill="#0F1117" stroke="#2D333B" stroke-width="1" rx="2"/>
      <text x="10" y="20" fill="#E6EDF3" font-family="monospace" font-size="11" font-weight="700">Agent Sentinel</text>
      <text x="10" y="36" fill="#7D8590" font-family="monospace" font-size="10">Role: Security &amp; Boundary Guard</text>
      <text x="10" y="48" fill="#F6821F" font-family="monospace" font-size="9">Acquire Lease [func:auth]</text>
    </g>

    <!-- Node 2 -->
    <g transform="translate(12, 112)">
      <rect width="236" height="58" fill="#0F1117" stroke="#2D333B" stroke-width="1" rx="2"/>
      <text x="10" y="20" fill="#E6EDF3" font-family="monospace" font-size="11" font-weight="700">Agent Payment</text>
      <text x="10" y="36" fill="#7D8590" font-family="monospace" font-size="10">Role: Financial Domain Refactor</text>
      <text x="10" y="48" fill="#10B981" font-family="monospace" font-size="9">Commit [AST Symbol Delta]</text>
    </g>

    <!-- Node 3 -->
    <g transform="translate(12, 180)">
      <rect width="236" height="58" fill="#0F1117" stroke="#2D333B" stroke-width="1" rx="2"/>
      <text x="10" y="20" fill="#E6EDF3" font-family="monospace" font-size="11" font-weight="700">Agent Optimizer</text>
      <text x="10" y="36" fill="#7D8590" font-family="monospace" font-size="10">Role: Darwinian Branch Evaluation</text>
      <text x="10" y="48" fill="#38BDF8" font-family="monospace" font-size="9">Fork [env.ARTIFACTS.fork]</text>
    </g>

    <!-- Node 4 -->
    <g transform="translate(12, 248)">
      <rect width="236" height="58" fill="#0F1117" stroke="#2D333B" stroke-width="1" rx="2"/>
      <text x="10" y="20" fill="#E6EDF3" font-family="monospace" font-size="11" font-weight="700">Agent Adversarial</text>
      <text x="10" y="36" fill="#7D8590" font-family="monospace" font-size="10">Role: Immune Fuzz Testing</text>
      <text x="10" y="48" fill="#F87171" font-family="monospace" font-size="9">Probe [Input Sanitization]</text>
    </g>

    <!-- Monorepo Scaling Note -->
    <g transform="translate(12, 316)">
      <rect width="236" height="136" fill="#0F1117" stroke="#2D333B" stroke-width="1" rx="2"/>
      <text x="10" y="22" fill="#E6EDF3" font-family="monospace" font-size="11" font-weight="700">High-Concurrency Pool</text>
      <text x="10" y="42" fill="#7D8590" font-family="monospace" font-size="10">• 100,000+ Concurrent Workers</text>
      <text x="10" y="58" fill="#7D8590" font-family="monospace" font-size="10">• REST / WebSocket Channels</text>
      <text x="10" y="74" fill="#7D8590" font-family="monospace" font-size="10">• Stateless Agent Toolcalls</text>
      <text x="10" y="90" fill="#7D8590" font-family="monospace" font-size="10">• Sub-50ms Edge Connection</text>
      <text x="10" y="116" fill="#10B981" font-family="monospace" font-size="10" font-weight="700">● Verified: 60 commits / sec</text>
    </g>
  </g>

  <!-- SECTION 2: DURABLE OBJECT SEQUENCER -->
  <g transform="translate(324, 70)">
    <rect width="360" height="470" fill="#161B22" stroke="#2D333B" stroke-width="1" rx="2"/>
    <rect width="360" height="30" fill="#1C212A"/>
    <text x="12" y="20" fill="#F6821F" font-family="monospace" font-size="11" font-weight="700">02 / CLOUDFLARE DURABLE OBJECT (REPOBRAIN)</text>

    <!-- Component 1 -->
    <g transform="translate(12, 44)">
      <rect width="336" height="88" fill="#0F1117" stroke="#2D333B" stroke-width="1" rx="2"/>
      <text x="12" y="22" fill="#E6EDF3" font-family="monospace" font-size="11" font-weight="700">Symbol Lease Engine &amp; Semantic Backpressure</text>
      <text x="12" y="42" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="11">Pre-commit edit-time locks on specific AST nodes.</text>
      <text x="12" y="58" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="11">Propagates dependency alerts downstream if an interface</text>
      <text x="12" y="74" fill="#F6821F" font-family="monospace" font-size="10">is locked for mutation by another agent (TTL: 5s).</text>
    </g>

    <!-- Component 2 -->
    <g transform="translate(12, 142)">
      <rect width="336" height="88" fill="#0F1117" stroke="#2D333B" stroke-width="1" rx="2"/>
      <text x="12" y="22" fill="#E6EDF3" font-family="monospace" font-size="11" font-weight="700">Transactional SQLite (ctx.storage.sql)</text>
      <text x="12" y="42" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="11">Relational tables for symbols, dependency graph, leases,</text>
      <text x="12" y="58" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="11">and operations log. Full ACID isolation per repository.</text>
      <text x="12" y="74" fill="#10B981" font-family="monospace" font-size="10">Sub-0.2ms internal SQLite query execution.</text>
    </g>

    <!-- Component 3 -->
    <g transform="translate(12, 240)">
      <rect width="336" height="98" fill="#0F1117" stroke="#2D333B" stroke-width="1" rx="2"/>
      <text x="12" y="22" fill="#E6EDF3" font-family="monospace" font-size="11" font-weight="700">AST-CRDT Conflict-Free Reconciler</text>
      <text x="12" y="42" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="11">Decomposes code into content-addressed AST symbols.</text>
      <text x="12" y="58" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="11">Reconciles orthogonal changes via Lamport clocks.</text>
      <text x="12" y="74" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="11">Includes Code Immune System &amp; Chrono-Revert.</text>
      <text x="12" y="90" fill="#38BDF8" font-family="monospace" font-size="10">0% Merge Conflicts on concurrent additions.</text>
    </g>

    <!-- Component 4 -->
    <g transform="translate(12, 348)">
      <rect width="336" height="104" fill="#0F1117" stroke="#2D333B" stroke-width="1" rx="2"/>
      <text x="12" y="22" fill="#E6EDF3" font-family="monospace" font-size="11" font-weight="700">Git Notes Provenance Engine</text>
      <text x="12" y="42" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="11">Preserves model attribution, prompt intent, reasoning</text>
      <text x="12" y="58" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="11">chains, and token telemetry without modifying SHA hashes.</text>
      <text x="12" y="74" fill="#A855F7" font-family="monospace" font-size="10">Mounted to: refs/notes/agent-provenance</text>
      <text x="12" y="90" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="10">Answers Cloudflare Question #4 (Reasoning Retention).</text>
    </g>
  </g>

  <!-- SECTION 3: STORAGE & INFERENCE -->
  <g transform="translate(716, 70)">
    <!-- Artifacts Box -->
    <rect width="292" height="230" fill="#161B22" stroke="#2D333B" stroke-width="1" rx="2"/>
    <rect width="292" height="30" fill="#1C212A"/>
    <text x="12" y="20" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="700">03 / CLOUDFLARE ARTIFACTS</text>

    <g transform="translate(12, 42)">
      <text x="0" y="16" fill="#E6EDF3" font-family="monospace" font-size="11" font-weight="700">Git Wire Smart HTTP</text>
      <text x="0" y="32" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="10">Wasm Git Engine running in Durable Objects</text>
      <text x="0" y="46" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="10">Protocol v1 &amp; v2 support over HTTPS</text>
    </g>

    <g transform="translate(12, 102)">
      <text x="0" y="16" fill="#E6EDF3" font-family="monospace" font-size="11" font-weight="700">Sparse Ephemeral Worktrees</text>
      <text x="0" y="32" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="10">Zero-copy blobless worktrees via ArtifactFS</text>
      <text x="0" y="46" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="10">Task-scoped subtrees for agent sandboxes</text>
    </g>

    <g transform="translate(12, 162)">
      <text x="0" y="16" fill="#E6EDF3" font-family="monospace" font-size="11" font-weight="700">Darwinian Branch Pruning</text>
      <text x="0" y="32" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="10">Auto-evaluates parallel agent solutions</text>
      <text x="0" y="46" fill="#10B981" font-family="monospace" font-size="10">Promotes winning branch, prunes losers</text>
    </g>

    <!-- Workers AI Box -->
    <g transform="translate(0, 245)">
      <rect width="292" height="225" fill="#161B22" stroke="#2D333B" stroke-width="1" rx="2"/>
      <rect width="292" height="30" fill="#1C212A"/>
      <text x="12" y="20" fill="#A855F7" font-family="monospace" font-size="11" font-weight="700">04 / WORKERS AI ARBITER</text>

      <g transform="translate(12, 44)">
        <text x="0" y="16" fill="#E6EDF3" font-family="monospace" font-size="11" font-weight="700">Llama 3.3 70B Instruct</text>
        <text x="0" y="34" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="11">Invoked only when incompatible</text>
        <text x="0" y="50" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="11">semantic invariants collide</text>
        <text x="0" y="66" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="11">(e.g. mutually exclusive signatures).</text>
        <text x="0" y="90" fill="#E6EDF3" font-family="monospace" font-size="10">Arbitration Strategy:</text>
        <text x="0" y="106" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="10">1. Synthesizes non-breaking union</text>
        <text x="0" y="122" fill="#7D8590" font-family="-apple-system, sans-serif" font-size="10">2. Emits Reverse PR if trade-off requires human decision</text>
        <text x="0" y="150" fill="#10B981" font-family="monospace" font-size="10">● Zero Cold-Start Edge Execution</text>
      </g>
    </g>
  </g>

  <!-- Connective Arrows -->
  <g stroke="#2D333B" stroke-width="1.5">
    <!-- Clients to DO -->
    <line x1="292" y1="200" x2="324" y2="200"/>
    <line x1="292" y1="360" x2="324" y2="360"/>
    <!-- DO to Artifacts -->
    <line x1="684" y1="185" x2="716" y2="185"/>
    <!-- DO to AI -->
    <line x1="684" y1="420" x2="716" y2="420"/>
  </g>
</svg>
